# voxeled layout — LEDs PLACED ON A STRUCTURE: three diffused LED ropes zip-tied along one steel
# tube, the way the Thread sculpture is built. The tube is a named PATH; each rope is a `rope`
# fixture that follows it, offset by the rope radius and wrapped at its own angle around the tube
# (Thread's three ropes sit at 60°, 180°, 300°). The emission normal of every LED is radial —
# away from the tube — so the simulator (S) shows each rope lit from its own side, and each rope is
# drawn as a 26 mm diffused tube (R toggles). The show is Thread's: per-strand patterns. The piece
# also has CONTROLS — two button panels that speak JSON to whatever is on the live socket, and the
# state it reports back (viewer/?example=ropes&ui=bar&sim=1 shows the public face).
#   run with:  node examples/mobius-heart/run.mjs examples/mobius-heart/layouts/ropes.yaml
# For the real Thread: paths from thread-3d's tubes.json —
#   paths: { tube-1: { file: ../../../thread-3d/model/out/tubes.json, index: 0, scaleToMM: 1000 } }
name: ropes
units: mm

paths:
  # an S-curved tube, 6 m long, rising as it goes (mm)
  tube: [[-3000, 600, 0], [-1800, 900, 500], [-600, 1100, 300], [600, 1200, -300], [1800, 1000, -500], [3000, 700, 0]]

fixtures:
  rope-top:   { type: rope, params: { path: tube, pitchMM: 33, radiusMM: 40, angleDeg: 60 } }
  rope-back:  { type: rope, params: { path: tube, pitchMM: 33, radiusMM: 40, angleDeg: 180 } }
  rope-front: { type: rope, params: { path: tube, pitchMM: 33, radiusMM: 40, angleDeg: 300 } }

instances:
  - { fixture: rope-top,   name: top }
  - { fixture: rope-back,  name: back }
  - { fixture: rope-front, name: front }

# a page's live socket: raw RGB frames or Art-Net (170 px per universe from 0) + control JSON
inputs:
  - { name: web, protocol: ws, priority: 100, timeoutMs: 800 }

# the piece's buttons — a press is {"type":"button","podpi":"a","button":"x","pressed":true} to
# whoever is on the socket; a {"type":"status"} message back fills the fields
controls:
  panels:
    - { name: pedestal A, buttons: [x, y, z], keys: { q: x, w: y, e: z }, message: { type: button, podpi: a, button: $button, pressed: $pressed } }
    - { name: pedestal B, buttons: [x, y, z], keys: { i: x, o: y, p: z }, message: { type: button, podpi: b, button: $button, pressed: $pressed } }
  status:
    type: status
    fields: [{ label: strand X, path: states.x }, { label: strand Y, path: states.y }, { label: strand Z, path: states.z }, { label: pedestals, path: podpi }]

show:
  holdS: 6
  fadeS: 2
  scenes:
    - { name: plasma,   pattern: plasma }
    - { name: fire,     pattern: fire }
    - { name: comet,    pattern: comet, params: { speed: 0.15, tail: 0.15 } }
    - { name: strands,  pattern: strands }
    - { name: chase,    pattern: ribbonChase, params: { loops: 2 } }
    - { name: normals,  pattern: normalRGB }
